[package]
name = "kanzencheki"
version = "0.1.0"
description = "A local-first cheki collection app"
license = "MIT"
edition = "2021"

[lib]
name = "kanzencheki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
sha2 = "0.10"
filetime = "0.2"
tar = "0.4"
lz4_flex = { version = "0.11", features = ["frame"] }
tempfile = "3"
tauri-plugin-dialog = "2"

trash = "5.2"
mime_guess = "2"

rustface = { version = "0.1.7", default-features = false }
tract-onnx = "0.22.1"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
